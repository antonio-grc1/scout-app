<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plataforma de gestión operativa, padrón y legajos del Grupo Scout Juan XXIII." />
    <meta name="theme-color" content="#0c0e13" />
    <title>Grupo Scout Juan XXIII - Sistema de Gestión</title>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('scout-theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = savedTheme === 'dark' || ((!savedTheme || savedTheme === 'system') && systemDark);
          var root = document.documentElement;

          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }

          var isContrast = false;
          var customRaw = localStorage.getItem('scout-theme-customization');
          if (customRaw) {
            var cfg = JSON.parse(customRaw);
            if (cfg.preset === 'contrast') {
              isContrast = true;
              root.setAttribute('data-contrast', 'aaa');
            } else {
              root.removeAttribute('data-contrast');
            }

            if (cfg.fontScale === '110%' || cfg.fontScale === '125%') {
              root.style.setProperty('--font-scale', cfg.fontScale);
            }
            if (cfg.logoScale && Number(cfg.logoScale) !== 1) {
              root.style.setProperty('--brand-logo-scale', String(cfg.logoScale));
            }
            if (typeof cfg.logoUrl === 'string' && !cfg.logoUrl.includes('..') && (/^\/[a-zA-Z0-9_.\-/% ]+$/.test(cfg.logoUrl.trim()) || /^https:\/\/[a-zA-Z0-9_.\-/:?=&%#]+$/.test(cfg.logoUrl.trim()))) {
              root.style.setProperty('--brand-logo-url', cfg.logoUrl.trim());
            }
          }

          var metaEl = document.querySelector('meta[name="theme-color"]');
          if (metaEl) {
            var metaHex = isContrast ? (isDark ? '#000000' : '#ffffff') : (isDark ? '#171a24' : '#ffffff');
            metaEl.setAttribute('content', metaHex);
          }
        } catch (e) {
          // Captura silenciosa para prevenir interrupción si localStorage está bloqueado
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
